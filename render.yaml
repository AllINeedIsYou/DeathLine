services:
  - type: web
    name: deathline
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MAIL_PROVIDER
        value: brevo
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM_NAME
        value: DeathLine
      - key: COOKIE_SECURE
        value: "true"
